function parseInsta(t,notes,src){

const sig=o=>o.courier+JSON.stringify([...o.items].map(String).sort())+o.pieces;
let files=[],choices={},extras=[];
function compute(){

 for(const o of orders){o.items=o.items.map(([n,q])=>{if(COLS.has(n.trim().toLowerCase())){const nn="ATOMIZER FOR TRAVEL "+n.trim()[0].toUpperCase()+n.trim().slice(1).toLowerCase();notes.push(`${o.order}: lone '${n}' treated as '${nn}'`);n=nn}return[n,q]})}

const today=new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});

 const ts=24+pad*.3;d.setFontSize(ts);d.text("NANYAL",L+W/2,y+ts,{align:"center"});y+=30+pad*.3;

function makePdf(D){let best=null;

const $=id=>document.getElementById(id);
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function count(el,to){const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)}
let D=null;
function render(first){
 D=compute();const o=$("out");o.style.display="block";
 const dupH=D.dups.length?`<div class="card"><h3>Duplicate order IDs — choose which label to keep</h3>${D.dups.map((u,i)=>`<div class="dup" data-oid="${e(u.oid)}"><b>${e(u.oid)}</b>${u.en.map((x,j)=>`<div>[${j+1}] ${x.courier} · ${e(x.source)} · pieces ${x.pieces} · ${e(x.items.map(a=>a[1]+" × "+a[0]).join(", "))}</div>`).join("")}${u.en.map((x,j)=>`<button data-c="${j}" class="${u.ch===j?"on":""}">Keep ${j+1} (${x.courier})</button>`).join("")}<button data-c="B" class="${u.ch==="B"?"on":""}">Keep both</button></div>`).join("")}</div>`:"";
 if(D.empty){o.innerHTML=dupH+`<div class="card"><h3>Nothing to build</h3>${D.notes.map(n=>`<div class="warn">⚠ ${e(n)}</div>`).join("")||"<div class='warn'>No readable orders found in the dropped files.</div>"}</div>`;return}
 const sheet=`<div class="sheet">${(()=>{const[a,b]=colSplit(D.groups);let k=0;return[a,b].map(c=>`<div class="card">${c.map(([n,v])=>`<div class="cat">${e(n)}</div>${v.map(([i,q])=>`<div class="row" style="animation-delay:${(k++)*40}ms"><span>${e(i)}</span><b>${q}</b></div>`).join("")}`).join("")}</div>`).join("")})()}</div>`;
 o.innerHTML=`<div class="stats">${[["Units to pack",D.grand],["Parcels",D.parcels],["Sum of pieces + extras",D.pieces+D.ex],["Flags",D.notes.length]].map((s,i)=>`<div class="st" style="animation-delay:${i*90}ms"><small>${s[0]}</small><div data-n="${s[1]}">0</div></div>`).join("")}</div>
 <div class="bar"><button class="btn p" id="dp">⬇ Download out sheet PDF</button><button class="btn" id="dr">Download audit report</button><button class="btn" id="cl">Clear &amp; start over</button></div>${dupH}${sheet}
 <div class="card"><h3>Courier routing</h3><div class="cc">${Object.entries(D.courier).map(([k,v])=>`<span><b>${k}</b> · ${v} parcels</span>`).join("")}</div></div>
 <div class="card"><h3>${D.notes.length?"Notes / flags":"Reconciliation"}</h3>${D.notes.length?D.notes.map(n=>`<div class="warn">⚠ ${e(n)}</div>`).join(""):'<div style="color:var(--ok)">✓ No flags — everything reconciled.</div>'}</div>`;
 o.querySelectorAll("[data-n]").forEach(el=>count(el,+el.dataset.n));
 if(first)o.scrollIntoView({behavior:"smooth",block:"start"})}
$("out").addEventListener("click",ev=>{const t=ev.target;
 if(t.closest("[data-c]")){choices[t.closest(".dup").dataset.oid]=t.dataset.c==="B"?"B":+t.dataset.c;render()}
 else if(t.id==="dp"){makePdf(D).save("Nanyal_Warehouse_Out_Sheet.pdf")}
 else if(t.id==="dr"){dl(new Blob([D.lines.join("\n")+"\n\nNOTES / FLAGS\n"+(D.notes.map(n=>"  ! "+n).join("\n")||"  none")],{type:"text/plain"}),"Nanyal_Warehouse_Out_Sheet_report.txt")}
 else if(t.id==="cl"){files=[];choices={};extras=[];$("out").style.display="none";chips()}});
function chips(){$("files").innerHTML=files.map((f,i)=>`<span class="chip">📄 ${e(f.name)} <b>${f.orders.length}</b><button data-r="${i}" title="Remove">✕</button></span>`).join("")}
$("files").addEventListener("click",ev=>{ev.stopPropagation();const i=ev.target.dataset.r;if(i!=null){files.splice(+i,1);chips();files.length?render():$("out").style.display="none"}});
async function add(list){
 const pdfs=[...list].filter(f=>/\.pdf$/i.test(f.name)||f.type==="application/pdf");$("err").textContent="";
 if(!pdfs.length){$("err").textContent="Please drop PDF label files.";return}
 $("busy").style.display="block";
 for(const f of pdfs){$("busyt").textContent="Reading "+f.name+"…";const notes=[];let orders=[];
  try{const t=await pdfText(await f.arrayBuffer());if(!t.trim())notes.push(`${f.name}: no text found (scanned image?) - skipped`);else orders=[...parsePostex(t,notes,f.name),...parseInsta(t,notes,f.name)]}
  catch(x){notes.push(`${f.name}: could not be read (${x.name||"Error"}) - skipped`)}
  files=files.filter(z=>z.name!==f.name);files.push({name:f.name,orders,notes});chips()}
 $("busy").style.display="none";render(true)}
const dz=$("drop");
dz.onclick=()=>$("pick").click();$("pick").onchange=e=>{add(e.target.files);e.target.value=""};
["dragenter","dragover"].forEach(v=>dz.addEventListener(v,ev=>{ev.preventDefault();dz.classList.add("over")}));
["dragleave","drop"].forEach(v=>dz.addEventListener(v,ev=>{ev.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",ev=>add(ev.dataTransfer.files));
addEventListener("dragover",e=>e.preventDefault());addEventListener("drop",e=>e.preventDefault());
</script>
</body>
</html>
